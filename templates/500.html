<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Có lỗi xảy ra — Mùa Vườn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@800&family=Special+Elite&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Trang này KHÔNG dùng Tailwind CDN hay base.html — cố tình tự chứa hoàn
       toàn (inline CSS thuần), vì lỗi 500 có thể xảy ra khi hệ thống đang gặp
       sự cố (DB/cache down) — không nên phụ thuộc thêm bất kỳ request nào
       (kể cả tải CDN ngoài) để đảm bảo trang lỗi luôn hiển thị được. */
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #2B2118; color: #F1E9D8; font-family: 'Work Sans', sans-serif; text-align: center;
    }
    .code { font-family: 'Big Shoulders', sans-serif; font-size: 6rem; color: #D89B2E; margin: 0; }
    .title { font-family: 'Big Shoulders', sans-serif; text-transform: uppercase; font-size: 1.8rem; margin: 0.5rem 0; }
    .desc { color: #F1E9D8AA; max-width: 28rem; margin: 0 auto 2rem; }
    a { display: inline-block; background: #D89B2E; color: #2B2118; font-family: 'Special Elite', monospace;
        text-transform: uppercase; font-size: 0.85rem; padding: 0.6rem 1.5rem; border-radius: 2px; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <p class="code">500</p>
    <p class="title">Sạp hàng đang trục trặc</p>
    <p class="desc">Có lỗi kỹ thuật xảy ra ở phía hệ thống — không phải do bạn. Vui lòng thử lại sau ít phút.</p>
    <a href="/">Về trang chủ</a>
  </div>
</body>
</html>
