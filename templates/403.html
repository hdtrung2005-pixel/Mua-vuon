{% extends "base.html" %}
{% block title %}Không có quyền truy cập — Mùa Vườn{% endblock %}
{% block content %}
<div class="text-center py-24">
  <p class="font-stamp text-8xl text-chili mb-4">403</p>
  <p class="font-display text-3xl uppercase mb-3">Khu vực này không dành cho bạn</p>
  <p class="font-body text-soil/60 mb-8 max-w-md mx-auto">
    {% if exception %}{{ exception }}{% else %}Bạn không có quyền truy cập trang này.{% endif %}
  </p>
  <a href="{% url 'storefront:home' %}"
     class="inline-block bg-soil text-paper font-stamp uppercase text-sm px-6 py-2.5 rounded-sm hover:bg-turmeric hover:text-soil transition-colors">
    Về trang chủ
  </a>
</div>
{% endblock %}
